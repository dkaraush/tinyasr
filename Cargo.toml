[package]
name = "tinyasr"
version = "0.1.0"
edition = "2024"

[lib]
# staticlib on demand (cargo rustc --crate-type staticlib, see README): a crate that lists it is built as one
# even as a dependency, which then fails without the runtime that only c-api carries.
crate-type = ["rlib"]

[features]
default = ["std"]
std = []
# C ABI (include/tinyasr.h). Without std it also carries the allocator and panic handler a C host needs.
c-api = ["ffi"]
# The C ABI alone, for a static library that bundles this crate with others and carries one runtime for all.
ffi = []

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
