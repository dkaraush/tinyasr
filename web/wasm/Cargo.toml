[package]
name = "tinyasr-web"
version = "0.1.0"
edition = "2024"

# The browser build of tinyasr: its C API (include/tinyasr.h) + memory allocation for JavaScript. See ../build.sh.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
tinyasr = { path = "../..", features = ["c-api"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
